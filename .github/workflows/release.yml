# Docket release: a v* tag becomes a DRAFT GitHub Release (ADR-31).
#
#   tag ──> gate (ci.yml, the full gate + build) ──> draft
#
# tag (contents: read): the tag must be v<package.json version> and its commit must be on main.
#   Cheap, so a wrong tag fails before the Windows gate spends minutes.
# gate (contents: read): calls ci.yml unchanged, so a release is verified by exactly the steps
#   every push runs; its build uploads dist/docket-<version>.tgz as the docket-tgz artifact.
# draft (contents: write): takes that verified tarball (never rebuilds it), writes
#   docket-<version>.tgz.sha256 (sha256sum format), and creates a draft release with both.
#   Re-running a failed run refreshes the assets of an existing DRAFT; a published release is
#   never touched. Publishing the draft is the owner's step (review it on GitHub, then
#   Publish), after which scripts/release/install.ps1 installs it by tag or as latest.
#
# Tags come from scripts/release/cut.ps1 (bump, commit, tag; it pushes only with its own
# explicit confirmation).

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.20.0"

jobs:
  tag:
    if: github.repository == 'dirtyredz/Docket'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out the tagged commit with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: The tag matches package.json and is on main
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version (expected v$version)"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  gate:
    needs: [tag]
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  draft:
    needs: [tag, gate]
    if: github.repository == 'dirtyredz/Docket'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the verified tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docket-tgz
          path: ${{ runner.temp }}/release

      - name: Write the SHA-256 checksum
        working-directory: ${{ runner.temp }}/release
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          tgz="docket-$VERSION.tgz"
          test -f "$tgz"
          sha256sum "$tgz" > "$tgz.sha256"
          cat "$tgz.sha256"

      - name: Create the draft release (or refresh an existing draft's assets)
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          assets=("docket-$VERSION.tgz" "docket-$VERSION.tgz.sha256")
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::release $TAG is already published; its assets are never replaced"
              exit 1
            fi
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --draft --verify-tag \
              --title "Docket $VERSION" \
              --notes "Docket $VERSION. Install: scripts/release/install.ps1 -Tag $TAG (verifies the SHA-256, then npm install --global, docket gate promote, docket gate install)."
          fi
